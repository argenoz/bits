			head, body

			.digit

				border-style:solid;
				border-width:1px;
				border-radius:5px;
				background-color:#fc9c54;
				vertical-align: middle;
				text-align: center;
				}
			.digit:hover

				background-color:#fdd0af;
				}
			.tablica  .digit, .tablica  .equ , .tablica .out_digita
				{
				width:40px;
				height:40px;
				}
			.equ

				background-image:url(./pics/equal-sign.webp);
				background-size:cover;

			.out_digita

		</style>
		<script>
			function delo()
				{
				let ewq = [0n,1n];
				
				
				(async()=>{
				let qwe = document.getElementsByClassName('digit');
				let i=0n, l = BigInt(qwe.length);
				let f = (ta)=>
						{
						if(ta.di==ewq[0n])
							ta.innerText=ta.di = ewq[1n];
						else
							ta.innerText=ta.di = ewq[0n];
						};
				while(i<l)
					{
					let ta = qwe[i];
					ta.innerText=ta.di = ewq[0n];
					ta.addEventListener('click',(e)=>{
						(async(t)=>{f(t);})(e.target);
						});
					i=i+ewq[1n];
					}
					}
					)();
					(async()=>{
					let qwe = document.getElementsByClassName('out_digita');
					let i = 0n;
					let l = qwe.length;
					while(i<l)
						{
						let ta = qwe[i];
						ta.value=0n;
						i=i+ewq[1n];
						}
					})();
				}
		</script>
	</head>
