		<script>
			let GGG = 0;
			let flg = false;
			function delo()
				{
				let ewq = [0n,1n];
				let makeTriple = (S)=>
					{
					let d=10n,table = document.createElement('table'),l=[];
					table.setAttribute('class',"tripla");
					let tr = document.createElement('tr');
					let td = 0,di;
					table.appendChild(tr);
					td = document.createElement('td');
					di = document.createElement('div');
					td.appendChild(di);
					td.setAttribute('colspan','3');
					di.innerText="deci";
					tr.appendChild(td);
					tr = document.createElement('tr');
					table.appendChild(tr);
					
					td = document.createElement('td');
					di = document.createElement('div');
					di.innerText = S%d;
					S = S/d;
					td.appendChild(di);
					l.push(td);
					td = document.createElement('td');
					di = document.createElement('div');
					di.innerText = S%d;
					S = S/d;
					td.appendChild(di);
					l.push(td);
					td = document.createElement('td');
					di = document.createElement('div');
					di.innerText = S%d;
					td.appendChild(di);
					l.push(td);
					tr.appendChild(l[2n]);
					tr.appendChild(l[1n]);
					tr.appendChild(l[0n]);
					return table;
					};
				let makeTable = ()=>{
						let tablica = document.createElement('table');
						let ro = document.createElement('tr');
						tablica.appendChild(ro);
						let i = 0n;
						let tagi=[];
						while(i<9n)
							{
							let dd = document.createElement('td');
							let ddd = document.createElement('div');
							tagi.push(ddd);
							dd.appendChild(ddd);
							ro.appendChild(dd);
							i=i+1n;
							}
						let sign = (e)=>{
							let td = document.createElement('td');
							let tr = document.createElement('tr');
							let di = document.createElement('div');
							tr.appendChild(td);
							td.setAttribute('colspan','9');
							td.appendChild(di);
							di.innerText=e;
							tablica.insertBefore(tr,tablica.childNodes[0]);
							};
						return {the_tag:tablica,tags:tagi,si:sign};
						};
				let spisok=[];
				let o_S=0n,o_mn=1n;
				(async()=>{
				let qwe = document.getElementsByClassName('digit');
				let i=0n, l = BigInt(qwe.length);
				let f = (ta)=>
						{
						if(ta.di==ewq[0n])
							ta.innerText=ta.di = ewq[1n];
						else
							ta.innerText=ta.di = ewq[0n];
						};
				let pre=null;
				while(i<l)
					{
					let ta = qwe[i];
					ta.innerText=ta.di = ewq[0n];
					ta.addEventListener('click',(e)=>{
						(async(t)=>{f(t);})(e.target);
						});
					if(pre!=null)
						pre.nexti = ta;
					pre = ta;
					i=i+ewq[1n];
					if(i==8n)
						pre = pre.nexti=null;
					}
				
					}
					)();
					(async()=>{
					let qwe = document.getElementsByClassName('out_digita');
					let i = 0n;
					let l = qwe.length;
					while(i<l)
						{
						let ta = qwe[i];
						ta.value=0n;
						i=i+ewq[1n];
						}
					})();
								(async ()=>{
				GGG = new XMLHttpRequest();
								GGG.onload=(e)=>
								{
					let importy = {
									env:
									{
			inputA:()=>{
				let q = document.getElementsByClassName('digit')[0n];
				let S = 0n , d=10n;
				let mn = 1n;
				while(q!=null)
					{
					if(q.innerText==1n){
							GGG.ex.setA1();
							S = S + mn;
								}
					else
							GGG.ex.setA0();
					q = q.nexti;
					mn = mn*2n;
					}
				document.getElementById('oa0').innerText=(S%d);
				S = S/d;
				document.getElementById('oa1').innerText=(S%d);
				S = S/d;
				document.getElementById('oa2').innerText=(S%d);
				
				
				},
			inputB:()=>{
				let mn=1n, S=0n,d=10n;
				let q = document.getElementsByClassName('digit')[8n];
				let p=document.getElementsByClassName('digit');
				while(q!=null)
					{
					if(q.innerText==1n){
							GGG.ex.setB1();
							S = S + mn;
								}
					else
							GGG.ex.setB0();
					q = q.nexti;
					mn = mn*2n;
					}
				document.getElementById('ob0').innerText=(S%d);
				S = S/d;
				document.getElementById('ob1').innerText=(S%d);
				S = S/d;
				document.getElementById('ob2').innerText=(S%d);
				
				},
			prepair:()=>
			{
			let l = spisok.l = [];
			o_mn = 1n;
			o_S = 0n;
			},
			output1:()=>{spisok.l = [1n]+spisok.l; },
			output0:()=>{spisok.l = [0n]+spisok.l;},
			//output1:()=>{spisok.l = spisok.l.push(1n);},
			//output0:()=>{spisok.l = spisok.l.push(0n);},
			set_summ:()=>
				{
				let na = 'osumm';
				let tbl = makeTable();
				let li = tbl.tags;
				let i = 0n;
				let lis = spisok.l;
				let S = 0n, mn = 1n;
				while(i<8n)
		      			{
					let tmp = lis[i];
		      			li[i].innerText=tmp;
					if(0n!=tmp)
						S = S + mn;
					mn = mn*2n;
		      			i=i+1n;
		      			}
		      		document.getElementById(na).innerHTML="";
		      		tbl.si('summ:');
				li[8n].parentElement.appendChild(makeTriple(S));
				document.getElementById(na).appendChild(tbl.the_tag);
				},
			set_diff:()=>
				{
				let na = 'odiff';
				let tbl = makeTable();
				let li = tbl.tags;
				let i = 0n;
				let lis = spisok.l;
				let S = 0n, mn = 1n;
				while(i<8n)
		      			{
					let tmp = lis[i];
		      			li[i].innerText=tmp;
					if(0n!=tmp)
						S = S + mn;
					mn = mn*2n;
		      			i=i+1n;
		      			}
		      		document.getElementById(na).innerHTML="";
		      		tbl.si('diff:');
				li[8n].parentElement.appendChild(makeTriple(S));
				document.getElementById(na).appendChild(tbl.the_tag);
				},
			set_neg:()=>
				{
				let na = 'oneg';
				let tbl = makeTable();
				let li = tbl.tags;
				let i = 0n;
				let lis = spisok.l;
				let S = 0n, mn = 1n;
				while(i<8n)
		      			{
					let tmp = lis[i];
		      			li[i].innerText=tmp;
					if(0n!=tmp)
						S = S + mn;
					mn = mn*2n;
		      			i=i+1n;
		      			}
				document.getElementById(na).innerHTML="";
		      		tbl.si('negative -a:');
				li[8n].parentElement.appendChild(makeTriple(S));
				document.getElementById(na).appendChild(tbl.the_tag);
				},
			set_inv:()=>
				{
				let na = 'oinv';
				let tbl = makeTable();
				let li = tbl.tags;
				let i = 0n;
				let lis = spisok.l;
				let S = 0n, mn = 1n;
				while(i<8n)
		      			{
					let tmp = lis[i];
		      			li[i].innerText=tmp;
					if(0n!=tmp)
						S = S + mn;
					mn = mn*2n;
		      			i=i+1n;
		      			}
				document.getElementById(na).innerHTML="";
		      		tbl.si('bitwise revert a:');
				li[8n].parentElement.appendChild(makeTriple(S));
				document.getElementById(na).appendChild(tbl.the_tag);
				}
			

									}//end of env
								};	
					
					GGG = GGG.response;
					GGG = {re:GGG, 
					wa :  WebAssembly.instantiate(new Uint8Array(GGG),importy)
					};//////////
					GGG.wa.then((e)=>{GGG.la=e;
							GGG.ex = e.instance.exports;
								});
					
					};

				GGG.open("GET","codes/codes.wasm",);
				GGG.responseType="arraybuffer";
				GGG.send();
				})();
				(async()=>{

				document.getElementById('reschet').addEventListener('click',

				(e)=>{
					e.stopPropagation();
					if(flg) return;
					flg = true;
					(async()=>{

						GGG.ex.do_work();

								})().then(()=>{flg=false;});
					
							}

							);
				
				})();
				
				}
		</script>
	</head>
